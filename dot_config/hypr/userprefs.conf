# Personal Hyprland configuration (HyDE userprefs)
# See https://hydeproject.pages.dev/en/configuring/hyprland/

input {
    kb_layout = us
    kb_options = ctrl:nocaps

    touchpad {
        natural_scroll = no
    }
}

# Source personal keybindings.
# These coexist with HyDE's keybindings.conf — duplicates are harmless.
source = ~/.config/hypr/conf.d/keymaps.conf
