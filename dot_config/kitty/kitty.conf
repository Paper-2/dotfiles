# HyDE theme integration (colors, font, etc. from active HyDE theme)
include hyde.conf

# Kitty — personal overrides (applied after hyde.conf)

font_family      Adwaita Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Noir palette
background            #0a0a0a
foreground            #e0e0e0
selection_background  #1f1f1f
selection_foreground  #ffffff
cursor                #e0e0e0
cursor_text_color     #0a0a0a

color0  #0a0a0a
color1  #cc3333
color2  #5a8a5a
color3  #c8a84b
color4  #4a7aaa
color5  #8a5a8a
color6  #4a8a8a
color7  #cccccc
color8  #3a3a3a
color9  #dd4444
color10 #6aaa6a
color11 #d8b85b
color12 #5a8abb
color13 #9a6a9a
color14 #5a9a9a
color15 #e0e0e0

window_padding_width 8
hide_window_decorations yes
background_opacity 0.95

scrollback_lines 10000
enable_audio_bell no
